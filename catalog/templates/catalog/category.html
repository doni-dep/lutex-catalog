<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>
</head>
<body>
    <h1>{{ category.name }}</h1>
    <a href="/">Назад</a>
    <ul>
        {% for product in products %}
            <li>{{ product.name }} – {{ product.price }} руб.</li>
        {% empty %}
            <li>В этой категории пока нет товаров.</li>
        {% endfor %}
    </ul>
</body>
</html>
