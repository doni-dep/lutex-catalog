<!DOCTYPE html>
<html>
<head><title>Хиты продаж</title></head>
<body>
    <h1>Хиты продаж</h1>
    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'catalog:product_detail' product.id %}">
                    {{ product.name }} - {{ product.price }} руб.
                </a>
            </li>
        {% empty %}
            <li>Хитов пока нет</li>
        {% endfor %}
    </ul>
</body>
</html>
